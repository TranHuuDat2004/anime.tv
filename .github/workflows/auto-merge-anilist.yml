name: Auto-merge AniList PRs

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  pull-requests: write
  contents: write

jobs:
  automerge:
    # Chỉ auto-merge các PR do API tạo (nhánh bắt đầu bằng auto/anilist-desc-)
    if: startsWith(github.head_ref, 'auto/anilist-desc-')
    runs-on: ubuntu-latest

    steps:
      - name: Auto-merge and delete branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --auto --squash --delete-branch


