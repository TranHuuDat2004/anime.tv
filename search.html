<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm Kiếm Anime - ANIME.TV</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Bạn có thể tạo một file CSS riêng cho trang search nếu cần nhiều style phức tạp -->
    <link rel="stylesheet" href="css/search-style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="icon" href="images/favicon.png" type="image/x-icon">
</head>
<body>
    <div id="header-placeholder"></div> <!-- Placeholder cho header -->

    <main id="search-page">
        <div class="container">
            <section class="search-form-section">
                <h1>Tìm Kiếm Anime</h1>
                <div class="search-bar-container">
                    <input type="text" id="searchInput" placeholder="Nhập tên anime, thể loại...">
                    <button id="searchButton" class="btn btn-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        Tìm
                    </button>
                </div>
            </section>

            <section class="search-results-section">
                <h2>Kết quả tìm kiếm</h2>
                <div id="searchResultsGrid" class="anime-grid">
                    <!-- Kết quả tìm kiếm sẽ được chèn vào đây bởi JavaScript -->
                    <p id="noResultsMessage" style="display: none; color: var(--text-secondary-color); text-align: center; width: 100%;">Không tìm thấy kết quả nào phù hợp.</p>
                </div>
            </section>
        </div>
    </main>

    <div id="footer-placeholder"></div> <!-- Placeholder cho footer -->

    <script src="js/header.js"></script> <!-- Nhúng header.js ở đầu (sau placeholder) -->
    <script src="js/footer.js"></script> <!-- Script cho slideshow -->
    <script src="js/navbar.js"></script> <!-- Script cho navbar (hamburger menu) -->

    <div id="featureNotification" class="notification">
        Tính năng này đang được cập nhật!
    </div>

    <script src="js/data.js"></script>
    <script>
        // JavaScript cho trang tìm kiếm
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('searchInput');
            const searchButton = document.getElementById('searchButton');
            const searchResultsGrid = document.getElementById('searchResultsGrid');
            const noResultsMessage = document.getElementById('noResultsMessage');

            // Hàm tạo anime card (tái sử dụng từ script.js của index.html nếu có thể, hoặc định nghĩa lại)
            function createAnimeCard(anime) {
                const card = document.createElement('div');
                card.className = 'anime-card';

                const link = document.createElement('a');
                link.href = `anime-detail.html?id=${anime.id}`;

                const img = document.createElement('img');
                img.src = anime.posterImage || 'https://via.placeholder.com/200x300?text=Poster';
                img.alt = anime.title;
                link.appendChild(img);

                const overlay = document.createElement('div');
                overlay.className = 'anime-card-overlay';
                const playIcon = document.createElement('span');
                playIcon.className = 'play-icon';
                playIcon.innerHTML = '►'; // Hoặc '►'
                overlay.appendChild(playIcon);
                link.appendChild(overlay);
                card.appendChild(link);

                const titleLink = document.createElement('a');
                titleLink.href = `anime-detail.html?id=${anime.id}`;
                const titleH3 = document.createElement('h3');
                titleH3.appendChild(titleLink);
                titleLink.textContent = anime.title;
                card.appendChild(titleH3);

                const infoP = document.createElement('p');
                let infoText = anime.type || '';
                if (anime.episodes && anime.episodes.total) {
                     infoText += (infoText ? ' • ' : '') + (typeof anime.episodes.total === 'number' ? `${anime.episodes.total} Tập` : anime.episodes.total);
                }
                infoP.textContent = infoText || 'N/A';
                card.appendChild(infoP);

                return card;
            }

            async function performSearch() {
                const searchTermRaw = searchInput.value.trim();
                const searchTerm = searchTermRaw.toLowerCase();
                const normalizeForSearch = (s) => {
                    // Chuẩn hóa để match "gotoubun" với "go-toubun" (bỏ dấu cách/dấu gạch/ ký tự đặc biệt)
                    return String(s || '')
                        .toLowerCase()
                        .replace(/[^a-z0-9]+/g, '');
                };
                const qNorm = normalizeForSearch(searchTermRaw);
                searchResultsGrid.innerHTML = ''; // Xóa kết quả cũ
                noResultsMessage.style.display = 'none'; // Ẩn thông báo không có kết quả

                if (!searchTerm) {
                    // Nếu không có từ khóa, không hiển thị gì hoặc hiển thị gợi ý
                    return;
                }

                const results = (typeof animeData !== 'undefined' && animeData)
                    ? animeData.filter(anime => {
                    const idNorm = normalizeForSearch(anime.id);
                    // Match theo id (slug) để gom đúng franchise
                    if (idNorm && qNorm && idNorm.includes(qNorm)) return true;

                    // Match theo title, altTitle
                    if (anime.title && anime.title.toLowerCase().includes(searchTerm)) {
                        return true;
                    }
                    if (anime.altTitle && anime.altTitle.toLowerCase().includes(searchTerm)) {
                        return true;
                    }

                    // Match theo phiên bản chuẩn hóa (đỡ phụ thuộc dấu - hoặc dấu cách)
                    const titleNorm = normalizeForSearch(anime.title);
                    if (titleNorm && qNorm && titleNorm.includes(qNorm)) return true;
                    const altTitleNorm = normalizeForSearch(anime.altTitle);
                    if (altTitleNorm && qNorm && altTitleNorm.includes(qNorm)) return true;

                    // Ảnh GIF trong genres (thể loại)
                    if (anime.genres && anime.genres.some(genre => genre.toLowerCase().includes(searchTerm))) {
                        return true;
                    }
                    if (anime.genres && anime.genres.some(genre => {
                        const gNorm = normalizeForSearch(genre);
                        return gNorm && qNorm && gNorm.includes(qNorm);
                    })) {
                        return true;
                    }
                    // (Tùy chọn) Ảnh GIF trong description
                    // if (anime.description && anime.description.toLowerCase().includes(searchTerm)) {
                    //     return true;
                    // }
                    return false;
                })
                    : [];

                // Hiển thị kết quả local trước
                let localIds = new Set();
                if (results.length > 0) {
                    results.forEach(anime => {
                        localIds.add(anime.id);
                        const card = createAnimeCard(anime);
                        searchResultsGrid.appendChild(card);
                    });
                }

                // Luôn gọi GraphQL API của AniList để bổ sung thêm kết quả (nếu có)
                try {
                    if (results.length === 0) {
                        noResultsMessage.textContent = 'Đang tìm kiếm trên AniList...';
                        noResultsMessage.style.display = 'block';
                    } else {
                        noResultsMessage.textContent = 'Đang tìm thêm trên AniList...';
                        noResultsMessage.style.display = 'block';
                    }

                    const anilistQuery = `
                      query ($search: String) {
                        Page(page: 1, perPage: 15) {
                          media(search: $search, type: ANIME, sort: SEARCH_MATCH) {
                            id
                            title { english romaji native }
                            coverImage { extraLarge large medium }
                            format
                            episodes
                            status
                          }
                        }
                      }
                    `;
                    const resp = await fetch('https://graphql.anilist.co', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query: anilistQuery, variables: { search: searchInput.value.trim() } })
                    });

                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    const payload = await resp.json();
                    const mediaList = payload?.data?.Page?.media || [];

                    if (mediaList.length === 0) {
                        noResultsMessage.textContent = `Không tìm thấy kết quả nào cho "${searchInput.value.trim()}".`;
                        noResultsMessage.style.display = 'block';
                        return;
                    }

                    let addedFromAniList = 0;
                    mediaList.forEach(media => {
                        const title = media.title.english || media.title.romaji || media.title.native;
                        const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');
                        
                        // Bỏ qua nếu đã có trong kết quả local
                        if (localIds.has(slug)) return;
                        
                        addedFromAniList++;
                        const anime = {
                            id: slug,
                            title: title,
                            posterImage: media.coverImage?.extraLarge || media.coverImage?.large || media.coverImage?.medium,
                            type: media.format === 'MOVIE' ? 'Movie' : 'Series',
                            episodes: { total: media.episodes }
                        };
                        
                        const card = createAnimeCard(anime);
                        const aList = card.querySelectorAll('a');
                        aList.forEach(a => {
                            a.href = `anime-detail.html?id=${encodeURIComponent(slug)}&q=${encodeURIComponent(title)}`;
                        });
                        searchResultsGrid.appendChild(card);
                    });

                    if (results.length === 0 && addedFromAniList === 0) {
                        noResultsMessage.textContent = `Không tìm thấy kết quả nào cho "${searchInput.value.trim()}".`;
                    } else {
                        noResultsMessage.textContent = 'Đã tải xong kết quả từ AniList.';
                        // Bạn cũng có thể dùng: noResultsMessage.style.display = 'none'; nếu không muốn hiện text này
                        setTimeout(() => noResultsMessage.style.display = 'none', 3000);
                    }
                } catch (e) {
                    noResultsMessage.textContent = `Không tìm thấy kết quả nào cho "${searchInput.value.trim()}".`;
                    noResultsMessage.style.display = 'block';
                }
            }

            searchButton.addEventListener('click', performSearch);

            // Cho phép tìm kiếm khi nhấn Enter trong ô input
            searchInput.addEventListener('keypress', function(event) {
                if (event.key === 'Enter') {
                    performSearch();
                }
            });

            // Tự động tìm kiếm khi người dùng gõ (debounce nếu cần cho hiệu suất)
            // let debounceTimeout;
            // searchInput.addEventListener('input', function() {
            //     clearTimeout(debounceTimeout);
            //     debounceTimeout = setTimeout(performSearch, 300); // Đợi 300ms sau khi gõ xong
            // });


            
        });
    </script>
        <script src="js/notification.js"></script> <!-- Script cho thông báo -->


</body>
</html>
